<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آسية الهبطي | الموقع الشخصي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #2d3748;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 600px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .avatar {
      width: 90px;
      height: 90px;
      background: #3182ce;
      color: #fff;
      font-size: 36px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #1a202c;
    }
    p {
      font-size: 16px;
      line-height: 1.7;
      color: #4a5568;
      margin-bottom: 25px;
    }
    .btn {
      display: inline-block;
      background: #3182ce;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #2b6cb0;
    }
    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #718096;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">آ</div>
    <h1>مرحباً، أنا آسية الهبطي</h1>
    <p>
      أهلاً بكم في موقعي الرسمي. هنا أشارك مشاريعي، أفكاري، وكل ما أعمل عليه.
      شكراً لزيارتكم!
    </p>
    <a href="mailto:assiyaelhabti207@gmail.com" class="btn">تواصل معي</a>
    <footer>© 2026 آسية الهبطي - جميع الحقوق محفوظة</footer>
  </div>
</body>
</html>
